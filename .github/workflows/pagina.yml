# Publica la página (docs/) y la vista previa de la app con datos ficticios (ui/ en /demo/) en GitHub Pages.
name: Página
on:
  push:
    branches: [main]
    paths: [docs/**, ui/**, .github/workflows/pagina.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pagina
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: "${{ steps.despliegue.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Armar el sitio
        run: |
          mkdir -p _sitio
          cp -R docs/. _sitio/
          mkdir -p _sitio/demo && cp -R ui/. _sitio/demo/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: _sitio }
      - id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
