# Revisión automática de cada cambio (y de cada pull request): si algo falla, se ve antes de que llegue a alguien.
# Sintaxis, privacidad básica, pruebas del motor (exporta de verdad con ffmpeg) y de la interfaz (español/inglés, celular, contraste, misma lógica que Python).
name: Revisar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: revisar-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  comun:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Sintaxis
        run: |
          node --check ui/app.js
          python3 -m py_compile bin/*.py pruebas/*.py ejemplos/*.py
          python3 -c "import json, glob; [json.load(open(f, encoding='utf-8')) for f in glob.glob('ui/idiomas/*.json') + glob.glob('estilos/*.json') + glob.glob('efectos/*/*.json') + glob.glob('plantillas/*/*.json') + ['ui/demo.json', 'pruebas/casos.json']]"
          for f in build.sh herramientas/*.sh pruebas/*.sh; do bash -n "$f"; done
      - name: Contrato interfaz ↔ app nativa
        run: python3 pruebas/contrato.py
      - name: Privacidad (correos personales y rutas de usuario)
        run: bash herramientas/revisar_privacidad.sh --generico
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Pruebas de Python
        run: python3 pruebas/test_python.py
      - name: Pruebas de la interfaz
        run: |
          npm i --no-save --ignore-scripts --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          mkdir -p capturas
          PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright" CAPTURAS=capturas node pruebas/interfaz.mjs
          # Transiciones: vista previa ↔ exportado (sin H.264 en este Chromium solo revisa que exporten y cuánto tardan).
          PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright" node pruebas/transiciones.mjs
          # Velocidad por tramo: cada cuadro exportado contra la vista previa (sin H.264 no reproduce, el resto sí se revisa).
          PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright" node pruebas/velocidad.mjs
      - name: Capturas para revisar a ojo
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: capturas, path: capturas, retention-days: 14, if-no-files-found: ignore }
  app:
    # La app nativa (Rust + Tauri, pieza «host-tauri»): pruebas, clippy y, en Linux, abrirla de verdad con una pantalla virtual.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults: { run: { shell: bash, working-directory: escritorio } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Lo que Tauri necesita en Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb
      - name: Pruebas y clippy (exactamente lo de Cargo.lock)
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: La app abierta en Linux (pantalla virtual)
        if: runner.os == 'Linux'
        run: bash pruebas/arranque.sh
      # Lo que va dentro de la app de Mac: Python, ffmpeg y ffprobe (con su huella) y whisper-cli compilado con Metal.
      - name: Lo que lleva la app de Mac (whisper-cli con Metal, ffmpeg)
        if: runner.os == 'macOS'
        run: |
          bash herramientas/preparar.sh mac
          H=vendor/mac/herramientas
          "$H/whisper-cli" --help >/dev/null 2>&1 || { "$H/whisper-cli" --help; exit 1; }
          otool -L "$H/whisper-cli" | grep -q Metal.framework
          "$H/ffmpeg" -hide_banner -version | head -1 && "$H/ffprobe" -hide_banner -version | head -1
