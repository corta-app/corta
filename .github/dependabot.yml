# Dependabot: avisa cuando hay versiones nuevas de las actions (fijadas por SHA) y abre un pull request para revisarlas.
# `cooldown`: espera unos días antes de proponer una versión recién publicada; si un paquete o una action fue secuestrada, casi
# siempre se descubre y se retira en ese plazo. Las alertas de seguridad (Dependabot security updates) no esperan.
# Nada se junta solo: cada pull request se revisa como cualquier aporte (ver CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "Actions" }
